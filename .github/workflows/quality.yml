name: Build and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/test-product-descriptions.py
      - run: python3 scripts/audit-publication.py
      - run: npx playwright install --with-deps chromium
      - name: Check homepage and clean URLs in desktop and mobile Chromium
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/pricepine-preview.log 2>&1 &
          node tests/home-browser.mjs
          node tests/eggs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-desktop-and-mobile
          path: |
            outputs/homepage-qa
            outputs/eggs-qa
          retention-days: 7
