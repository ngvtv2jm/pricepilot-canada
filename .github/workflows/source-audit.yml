name: Retailer source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/discovery/audit-sources.mjs, .github/workflows/source-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: node scripts/discovery/audit-sources.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/source-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public retailer source audit [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
